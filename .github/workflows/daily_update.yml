name: Daily PM2.5 Data Update

on:
  schedule:
    # รันทุกวันเวลา 00:00 UTC (เท่ากับ 07:00 น. เวลาไทย)
    - cron: '0 0 * * *'
  workflow_dispatch: # อนุญาตให้กดรันเองผ่านหน้าเว็บ GitHub ได้ด้วย

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow requests

      - name: Run Daily Update Script
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          python daily_update.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add สนามกีฬาจังหวัดพะเยา_processed.parquet
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily PM2.5 data [skip ci]" && git push)